# Standalone nginx LB for 2x TP4+EP4 vLLM replicas (GLM-5.2 prefill).
# Run:   nginx -c /workspace/glm/nginx_lb.conf
# Stop:  nginx -c /workspace/glm/nginx_lb.conf -s quit
# Clients hit http://127.0.0.1:8000 (OpenAI-compatible), same as a single vLLM.
#
# Why least_conn: a 60-100k prefill occupies a replica for several seconds. With 2
# concurrent requests, least_conn puts one on each replica (1+1) instead of piling
# both onto one (which we measured at 5.7s vs 3.11s). This is THE property that makes
# the split-server topology beat DP2/EP8.

worker_processes  2;
pid               /tmp/nginx_lb.pid;
error_log         /tmp/nginx_lb.err.log warn;

events {
    worker_connections  4096;
}

http {
    access_log  off;
    # 100k-token prompts serialized as JSON int arrays are several MB.
    client_max_body_size     512m;
    client_body_buffer_size  16m;
    client_body_temp_path    /tmp/nginx_lb_body;

    proxy_temp_path          /tmp/nginx_lb_proxy;
    # Generous timeouts: prefill is seconds, long generations can be minutes.
    proxy_connect_timeout    30s;
    proxy_send_timeout       3600s;
    proxy_read_timeout       3600s;

    upstream vllm_replicas {
        least_conn;                       # <-- key: route to the replica with fewest in-flight conns
        server 127.0.0.1:8001 max_fails=0;
        server 127.0.0.1:8002 max_fails=0;
        keepalive 64;                     # reuse upstream conns, lower latency
    }

    server {
        listen 8000;

        location / {
            proxy_pass http://vllm_replicas;

            proxy_http_version 1.1;
            proxy_set_header Connection "";     # enable upstream keepalive
            proxy_set_header Host $host;

            # Streaming (SSE) — deliver first token immediately for true TTFT.
            proxy_buffering          off;
            proxy_request_buffering  off;       # don't buffer huge prompt bodies to disk first
            proxy_cache              off;
            chunked_transfer_encoding on;
        }
    }
}
